name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Los tres sistemas solo compilan y suben artefactos. Nunca publican.
  #
  # Antes cada job corría `electron-builder --publish always`, y los tres
  # intentaban crear el Release a la vez ("creating GitHub release reason=
  # release doesn't exist"): el último en escribir se llevaba por delante las
  # subidas de los otros, así que el Release acababa con solo un instalador.
  # Publicar es responsabilidad de un único job, más abajo.
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run gen-icon

      - name: Build
        shell: bash
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  # Un solo job crea el Release y adjunta todo, cuando ya están los tres.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Comprobar que están los tres sistemas
        run: |
          ls -la artifacts
          for pat in '*-arm64.dmg' '*.exe' '*.AppImage'; do
            if ! ls artifacts/$pat >/dev/null 2>&1; then
              echo "Falta un instalador: $pat"
              exit 1
            fi
          done

      # Queda en borrador a propósito: las notas se escriben a mano antes de
      # publicarlo con `gh release edit <tag> --draft=false`.
      - name: Publicar en el Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" \
              --notes "Instaladores para macOS, Windows y Linux."
          fi
